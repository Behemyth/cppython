name: Check Native Status
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: native-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: synodic/.github/.github/workflows/native-check.yml@v1.0.0
    with:
      fast-command: pdm run check-fast
      native-lanes: >-
        [
          {"name": "windows-x64-msvc", "runner": "windows-2025-vs2026", "toolchain": "msvc", "command": "pdm run test"},
          {"name": "windows-arm64-msvc", "runner": "windows-11-vs2026-arm", "toolchain": "msvc", "command": "pdm run test"},
          {"name": "ubuntu-x64-llvm-libcxx", "runner": "ubuntu-26.04", "toolchain": "llvm-libcxx", "command": "pdm run test"},
          {"name": "ubuntu-arm64-llvm-libcxx", "runner": "ubuntu-26.04-arm", "toolchain": "llvm-libcxx", "command": "pdm run test"},
          {"name": "macos-arm64-llvm-libcxx", "runner": "macos-26", "toolchain": "llvm-libcxx", "command": "pdm run test"}
        ]
